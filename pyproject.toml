[project]
name = "xianyu-auto-reply-fix"
version = "3.0.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "aiohttp-socks>=0.8,<1",
  "aiohttp>=3.9,<4",
  "alembic==1.16.5",
  "bbpb>=1.4.2,<2",
  "cryptography>=48.0.1,<49",
  "DrissionPage>=4,<5",
  "email-validator>=2,<3",
  "fastapi>=0.111,<1",
  "httpx>=0.25,<1",
  "loguru>=0.7,<1",
  "openai>=1.50,<2",
  "openpyxl>=3.1,<4",
  "pandas>=2,<3",
  "passlib[bcrypt]>=1.7.4,<2",
  "Pillow>=12.3,<13",
  "playwright==1.59.0",
  "psutil>=5.9,<8",
  "PyExecJS>=1.5.1,<2",
  "PyJWT>=2.8,<3",
  "python-dateutil>=2.8,<3",
  "python-multipart>=0.0.6,<1",
  "python-socks[asyncio]>=2,<3",
  "PyYAML>=6,<7",
  "qrcode[pil]>=7.4.2,<9",
  "requests>=2.31,<3",
  "SQLAlchemy==2.0.43",
  "uvicorn[standard]>=0.29,<1",
  "websockets>=10,<13",
  "xlsxwriter>=3.1,<4",
]

[dependency-groups]
dev = [
  "bandit[toml]>=1.7,<2",
  "mypy>=1.11,<2",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
  "types-requests>=2.31,<3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
pythonpath = ["."]
markers = ["asyncio: run an async test with pytest-asyncio"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["pb.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"XianyuAutoAsync.py" = ["E", "F", "B", "UP", "SIM", "RUF"]
"reply_server.py" = ["E", "F", "B", "UP", "SIM", "RUF"]
"tests/*" = ["S101", "B017"]
"xianyu_control/accounts_router.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
exclude = ["XianyuAutoAsync.py", "reply_server.py", "pb.py"]

[[tool.mypy.overrides]]
module = [
  "DrissionPage.*",
  "execjs.*",
  "loguru.*",
  "playwright.*",
  "qrcode.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "XianyuAutoAsync",
  "config",
  "db_manager",
  "utils.*",
]
follow_imports = "skip"
ignore_errors = true

[[tool.mypy.overrides]]
module = "xianyu_connector.infrastructure.legacy_connection_adapter"
disallow_subclassing_any = false
disallow_untyped_defs = false
warn_return_any = false

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B105", "B608"]

[tool.coverage.run]
branch = true
omit = [
  "xianyu_connector/browser_auth_worker.py",
  "xianyu_connector/infrastructure/legacy_connection_adapter.py",
  "xianyu_connector/main.py",
  "xianyu_connector/ops.py",
  "xianyu_connector/ports/*",
  "xianyu_connector/worker_main.py",
  "xianyu_control/connector_client.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
